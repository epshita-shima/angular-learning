<div class="max-w-4xl mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4 text-center">User List</h2>

  <!-- Form -->
  <form (ngSubmit)="addUser()" class="bg-white p-4 rounded shadow mb-6 space-y-3">
    <div class="grid md:grid-cols-3 gap-4">
      <input
        [(ngModel)]="newUser.name"
        name="name"
        type="text"
        placeholder="Name"
        required
        class="border px-3 py-2 rounded w-full"
      />
      <input
        [(ngModel)]="newUser.username"
        name="username"
        type="text"
        placeholder="Username"
        required
        class="border px-3 py-2 rounded w-full"
      />
      <input
        [(ngModel)]="newUser.email"
        name="email"
        type="email"
        placeholder="Email"
        required
        class="border px-3 py-2 rounded w-full"
      />
    </div>
    <div class="text-right">
      <button type="submit" class="mt-3 bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            {{ isEditMode ? 'Update User' : 'Add User' }}
      </button>
    </div>
  </form>

  <!-- Data Table -->
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white border border-gray-200 rounded shadow">
      <thead class="bg-gray-100">
        <tr>
          <th class="text-left py-2 px-4 border-b">Sl.</th>
          <th class="text-left py-2 px-4 border-b">Name</th>
          <th class="text-left py-2 px-4 border-b">Username</th>
          <th class="text-left py-2 px-4 border-b">Email</th>
          <th class="text-center py-2 px-4 border-b">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users let i=index"  class="hover:bg-gray-50">
           <td class="py-2 px-4 border-b">{{ i+ 1 }}</td>
          <td class="py-2 px-4 border-b">{{ user.name }}</td>
          <td class="py-2 px-4 border-b">{{ user.username }}</td>
          <td class="py-2 px-4 border-b">{{ user.email }}</td>
          <td class="py-2 px-4 border-b text-center">
               <button
          (click)="editUser(user)"
          class="bg-yellow-400 text-black px-4 py-1 rounded hover:bg-yellow-500"
        >
          Edit
        </button>
            <button
              (click)="deleteUser(user.id!)"
              class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600 ml-2"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
