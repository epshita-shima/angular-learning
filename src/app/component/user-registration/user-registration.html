<div class="max-w-md mx-auto py-10">
  <h2 class="text-3xl font-bold text-center mb-6">Registration Form</h2>

  <form
    [formGroup]="registrationForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4 bg-white p-6 border rounded shadow-md"
  >
      <div>
     <label class="block mb-1 font-medium">Full Name</label>
      <input
        formControlName="fullName"
        type="text"
        class="border border-gray-300 p-2 w-full rounded"
      />
      <small
        *ngIf="f['fullName'].touched && f['fullName'].invalid"
        class="text-red-600"
      >
        Name is required
      </small>
    </div>

    <!-- Email -->
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input
        formControlName="email"
        type="email"
        class="border border-gray-300 p-2 w-full rounded"
      />
      <small
        *ngIf="f['email'].touched && f['email'].errors?.['required']"
        class="text-red-600"
      >
        Email is required
      </small>
      <small
        *ngIf="f['email'].touched && f['email'].errors?.['email']"
        class="text-red-600"
      >
        Invalid email
      </small>
    </div>

    <!-- Password -->
    <div>
      <label class="block mb-1 font-medium">Password</label>
      <input
        formControlName="password"
        type="password"
        class="border border-gray-300 p-2 w-full rounded"
      />
      <small
        *ngIf="f['password'].touched && f['password'].errors?.['required']"
        class="text-red-600"
      >
        Password is required
      </small>
      <small
        *ngIf="f['password'].touched && f['password'].errors?.['minlength']"
        class="text-red-600"
      >
        Minimum 6 characters required
      </small>
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="block mb-1 font-medium">Confirm Password</label>
      <input
        formControlName="confirmPassword"
        type="password"
        class="border border-gray-300 p-2 w-full rounded"
      />
      <small
        *ngIf="
          registrationForm.errors?.['mismatch'] &&
          f['confirmPassword'].touched
        "
        class="text-red-600"
      >
        Passwords do not match
      </small>
    </div>


    <!-- Gender (Radio) -->
    <div>
      <label class="block mb-1 font-medium">Gender</label>
      <label class="mr-4">
        <input type="radio" formControlName="gender" value="male" /> Male
      </label>
      <label>
        <input type="radio" formControlName="gender" value="female" /> Female
      </label>
      <small
        *ngIf="f['gender'].touched && f['gender'].invalid"
        class="text-red-600 block"
      >
        Gender is required
      </small>
    </div>

    <!-- Hobbies (Checkbox Group) -->
    <div>
      <label class="block mb-1 font-medium">Hobbies</label>
      <label class="block">
        <input type="checkbox" (change)="onHobbyChange($event)" value="Reading" />
        Reading
      </label>
      <label class="block">
        <input type="checkbox" (change)="onHobbyChange($event)" value="Traveling" />
        Traveling
      </label>
      <label class="block">
        <input type="checkbox" (change)="onHobbyChange($event)" value="Coding" />
        Coding
      </label>
    </div>

    <!-- Country (Dropdown) -->
    <div>
      <label class="block mb-1 font-medium">Country</label>
      <select
        formControlName="country"
        (change)="onCountryChange($event)"
        class="border border-gray-300 p-2 w-full rounded"
      >
        <option value="">Select country</option>
        <option value="bd">Bangladesh</option>
        <option value="ca">Canada</option>
      </select>
      <small
        *ngIf="f['country'].touched && f['country'].invalid"
        class="text-red-600"
      >
        Country is required
      </small>
    </div>

    <!-- City (Nested Dropdown) -->
    <div *ngIf="cities.length > 0">
      <label class="block mb-1 font-medium">City</label>
      <select
        formControlName="city"
        class="border border-gray-300 p-2 w-full rounded"
      >
        <option value="">Select city</option>
        <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
      </select>
    </div>

    <!-- Submit Button -->
    <button
      type="submit"
      [disabled]="registrationForm.invalid"
      class="bg-green-500 hover:bg-green-600 w-1/3 disabled:bg-gray-400 transition-all text-white px-4 py-2 rounded mx-auto block"
    >
      Register
    </button>
  </form>
</div>
